name: Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'licenses/echarts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare site artifact with third-party licenses
        run: |
          mkdir -p "$RUNNER_TEMP/kinarc-pages/licenses"
          cp -R site/. "$RUNNER_TEMP/kinarc-pages/"
          cp -R licenses/echarts "$RUNNER_TEMP/kinarc-pages/licenses/echarts"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/kinarc-pages
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
